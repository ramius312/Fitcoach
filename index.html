<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><link rel="manifest" href="manifest.json"><title>FIT//COACH</title><style> *{box-sizing:border-box}body{background:#101820;color:#eef5f5;font:16px system-ui;margin:auto;max-width:760px;padding:16px}h1{color:#63e6be}section{background:#1c2933;border-radius:16px;padding:18px;margin:12px 0}input,select,button{font:inherit;padding:10px;border:1px solid #50616c;border-radius:8px;background:#101820;color:white;max-width:100%}input,select{width:100%;margin:5px 0 12px}button{background:#63e6be;color:#10231e;font-weight:bold;cursor:pointer;margin:4px}nav{display:flex;flex-wrap:wrap}label{display:block;color:#b9c9ce}small{color:#b9c9ce}progress{width:100%;accent-color:#63e6be}svg{width:100%;height:150px}article{border-top:1px solid #50616c;padding:12px 0}h2{margin-top:0} .big{font-size:30px;font-weight:bold} </style><h1>FIT//COACH <small>2.0</small></h1><nav id="nav"></nav><main id="main"></main><script>
const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('sv-SE'), defaults={age:41,height:180,weight:78,sex:5,activity:1.45,target:75,weeks:8,mode:'both',sport:'Laufen',minutes:45,days:3,km:10,current:59,race:10,goal:55,food:[],weights:[],training:[]};let s;try{s={...defaults,...JSON.parse(localStorage.fitcoach||'{}')}}catch{s={...defaults}};let tab='Übersicht';const save=()=>localStorage.fitcoach=JSON.stringify(s), n=x=>Number(x), r=x=>Math.round(x), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), field=(k,l,min,max,step=1)=>`<label>${l}<input id="${k}" type="number" min="${min}" max="${max}" step="${step}" value="${s[k]}"></label>`, sel=(k,l,opts)=>`<label>${l}<select id="${k}">${opts.map(([v,t])=>`<option value="${v}" ${String(s[k])===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`;function update(keys){for(let k of keys){let e=$(k);if(!e.checkValidity()||e.value===''){alert('Bitte gültige Werte eingeben.');return} }for(let k of keys){let e=$(k);s[k]=e.type==='number'?n(e.value):e.value}save();render()}
function calc(){let w=s.weights.length?[...s.weights].sort((a,b)=>b.date.localeCompare(a.date))[0].kg:s.weight,bmr=10*w+6.25*s.height-5*s.age+n(s.sex),base=bmr*n(s.activity),delta=s.target-w,rate=delta<0?-.004*w:.002*w,days=s.weeks*7,desired=s.mode==='time'?rate* s.weeks:delta,raw=s.mode==='both'?desired*7700/days:rate*7700/7,adj=Math.max(-Math.min(500,base*.2,Math.max(0,base-bmr)),Math.min(300,raw));if(s.mode!=='time'&&Math.abs(delta)<.01)adj=0;if((w/(s.height/100)**2<=18.5||s.target/(s.height/100)**2<18.5)&&adj<0)adj=0;let exercise=s.training.filter(x=>x.date===today()).reduce((a,x)=>a+x.minutes*w*(x.sport==='Krafttraining'?3:5)/60,0), kcal=r(base+adj+exercise),p=r(w*1.6),f=r(w*.9),c=Math.max(0,r((kcal-p*4-f*9)/4));return {w,bmr,base,adj,kcal,p,f,c,delta,rate,days,exercise}}
const recipes=[{name:'Skyr-Hafer-Porridge',k:459,p:36,c:57,f:10,items:'60 g Haferflocken, 200 g Skyr, 100 g Beeren, 10 g Mandeln, 150 g Wasser',steps:'Haferflocken und Wasser 8 Min. / 90 °C / Linkslauf Stufe 1. Abkühlen lassen, Skyr unterrühren, Beeren und Mandeln daraufgeben.'},{name:'Lachs-Reis-Bowl',k:650,p:42,c:67,f:24,items:'150 g Lachs, 80 g Reis trocken, 150 g Karotten, 150 g Zucchini, 5 g Öl',steps:'Reis nach Packungsangabe im Garkorb mit ausreichend Wasser garen. Gemüse und Lachs im Varoma mit freien Dampfschlitzen etwa 20–25 Min. / Varoma / Stufe 1 garen. Garzustand prüfen; Fisch vollständig durchgaren.'},{name:'Hähnchen-Linsen-Curry',k:570,p:49,c:57,f:16,items:'150 g Hähnchenbrust, 70 g rote Linsen, 150 g Tomaten, 50 g Zwiebel, 50 g leichte Kokosmilch, 5 g Öl, 250 g Wasser',steps:'Zwiebel 5 Sek. / Stufe 5. Öl 3 Min. / 120 °C / Stufe 1. Rest zugeben, 25 Min. / 100 °C / Linkslauf Sanftrührstufe. Flüssigkeit und Garzustand prüfen; Hähnchen mindestens 70 °C für 2 Minuten im Kern.'},{name:'Quark-Bananen-Shake',k:330,p:33,c:43,f:3,items:'250 g Magerquark, 120 g Banane, 100 g Milch 1,5 %, Wasser nach Bedarf',steps:'Alles 30 Sek. / Stufe 7 mixen.'}];

recipes.push(...[
{name:'Apfel-Zimt-Haferbrei',k:420,p:23,c:62,f:9,items:'60 g Haferflocken, 200 g Milch 1,5 %, 150 g Apfel, 100 g Skyr, Zimt',steps:'Apfel 4 Sek. / Stufe 5. Hafer und Milch 9 Min. / 90 °C / Linkslauf Stufe 1. Skyr nach Abkühlen unterheben.'},
{name:'Tomaten-Linsen-Suppe',k:490,p:25,c:68,f:12,items:'90 g rote Linsen, 250 g Tomaten, 50 g Zwiebel, 10 g Öl, 350 g Wasser',steps:'Zwiebel 5 Sek. / Stufe 5, Öl 3 Min. / 120 °C / Stufe 1. Rest 25 Min. / 100 °C / Stufe 1. Bei Bedarf länger garen.'},
{name:'Bananen-Hafer-Smoothie',k:460,p:27,c:65,f:10,items:'120 g Banane, 40 g Hafer, 250 g Milch, 150 g Skyr',steps:'Alles 40 Sek. / Stufe 8 mixen.'},
{name:'Kartoffeln mit Kräuterquark',k:480,p:34,c:66,f:9,items:'350 g Kartoffeln, 250 g Magerquark, 10 g Öl, Kräuter, 500 g Wasser zum Garen',steps:'Kartoffeln im Garkorb 25–30 Min. / Varoma / Stufe 1 garen. Garprobe. Quark mit Kräutern und Öl verrühren.'},
{name:'Couscous-Kichererbsen-Bowl',k:610,p:23,c:92,f:17,items:'80 g Couscous, 120 g Kichererbsen gekocht, 150 g Paprika, 10 g Öl',steps:'Paprika 4 Sek. / Stufe 5. Couscous nach Packungsangabe mit heißem Wasser quellen lassen. Kichererbsen abspülen und alles mischen.'},
{name:'Beeren-Quark',k:310,p:34,c:29,f:7,items:'250 g Magerquark, 150 g Beeren, 10 g Mandeln',steps:'Beeren und Quark 20 Sek. / Stufe 4 mischen. Mandeln darübergeben.'}
]);
function foodSearch(){return `<section><h2>Lebensmittelsuche</h2><small>Open Food Facts: Internet erforderlich, Produktangaben können unvollständig sein.</small><input id="query" placeholder="Produktname oder Barcode"><button onclick="lookupFood()">Suchen</button><div id="results"></div></section>`}
let found=[];async function lookupFood(){let q=$('query').value.trim(),out=$('results');if(!q)return;out.textContent='Suche läuft …';try{let fields='product_name,nutriments,code',url=/^\d{8,14}$/.test(q)?`https://world.openfoodfacts.org/api/v2/product/${q}.json?fields=${fields}`:`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=${fields}`;let res=await fetch(url);if(!res.ok)throw Error();let data=await res.json();found=(data.products||[data.product]).filter(x=>x&&x.product_name&&['energy-kcal_100g','proteins_100g','carbohydrates_100g','fat_100g'].every(k=>Number.isFinite(x.nutriments?.[k])));out.innerHTML=found.length?found.map((x,i)=>`<article>${esc(x.product_name)} · ${x.nutriments['energy-kcal_100g']} kcal/100 g <button onclick="chooseFood(${i})">Übernehmen</button></article>`).join(''):'Keine vollständigen Treffer. Bitte manuell erfassen.'}catch{out.textContent='Suche nicht verfügbar. Bitte manuell erfassen.'}}
function chooseFood(i){let x=found[i];$('name').value=x.product_name;['energy-kcal_100g','proteins_100g','carbohydrates_100g','fat_100g'].forEach((k,j)=>$('f'+j).value=x.nutriments[k]);$('portion').value=1;alert('Werte pro 100 g übernommen. Portionen: 1 = 100 g, 1,5 = 150 g.');$('name').scrollIntoView()}
function weekly(a){let plan=Array.from({length:7},(_,d)=>{let ids=[d%2?4:0, [1,2,5,7,8,2,1][d], [7,8,1,5,2,7,8][d],d%2?3:9];let meals=ids.map(i=>recipes[i]);let total=meals.reduce((v,x)=>v+x.k,0),scale=Math.max(.5,Math.min(2,a.kcal/total));return {meals,scale,total}});return `<section><h2>7-Tage-Ernährungsplan</h2><small>Portionsfaktor anhand des aktuellen Kalorienziels; Makros sind Schätzwerte. Mengen einschließlich Wasser nicht blind skalieren, Mixtopfgrenzen beachten.</small>${plan.map((d,i)=>`<article><h3>${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][i]}</h3>${d.meals.map(x=>`<p>${x.name} · ${d.scale.toFixed(2)} Portionen</p>`).join('')}<small>${r(d.total*d.scale)} kcal · ${r(d.meals.reduce((v,x)=>v+x.p,0)*d.scale)} g Protein</small></article>`).join('')}<button onclick="copyShopping()">Einkaufsliste anzeigen</button><div id="shopping"></div></section>`}
function copyShopping(){let counts={};for(let d=0;d<7;d++){let ids=[d%2?4:0,[1,2,5,7,8,2,1][d],[7,8,1,5,2,7,8][d],d%2?3:9],scale=Math.max(.5,Math.min(2,calc().kcal/ids.reduce((v,i)=>v+recipes[i].k,0)));for(let i of ids)for(let item of recipes[i].items.split(', ')){let m=item.match(/^(\d+) g (.+)$/);if(m&&!m[2].includes('Wasser'))counts[m[2]]=(counts[m[2]]||0)+Number(m[1])*scale;else if(!item.includes('Wasser'))counts[item]=null}}$('shopping').innerHTML='<h3>Einkaufsliste (geschätzt)</h3>'+Object.entries(counts).sort().map(([k,v])=>`<label><input style="width:auto" type="checkbox"> ${v===null?'nach Bedarf':r(v)+' g'} ${esc(k)}</label>`).join('')}
function performance(){return `<section><h2>Leistungsziel und Zeitraum</h2><p>Aktuelle Vergleichszeit: ${(s.current*(s.race/s.km)**1.06).toFixed(1)} min</p><label>Wochen bis zum Wettkampf<input id="raceweeks" type="number" min="1" max="52" value="${s.raceweeks||8}"></label><button onclick="if($('raceweeks').checkValidity()&&$('raceweeks').value){s.raceweeks=n($('raceweeks').value);save();render()}">Berechnen</button><p>Erforderliche Zeitverbesserung: ${Math.max(0,100*(1-s.goal/(s.current*(s.race/s.km)**1.06))).toFixed(1)} % insgesamt.</p><small>Keine belastbare individuelle Leistungsprognose ohne Verlaufsdaten. Folgender Plan ist eine konservative Vorlage, keine Garantie.</small>${Array.from({length:s.raceweeks||8},(_,i)=>`<article>Woche ${i+1}: ${s.days} Einheiten · ${r(s.minutes*s.days*(i===(s.raceweeks||8)-1?.7:i%4===3?.8:Math.min(1.2,1+.025*i)))} Minuten gesamt · ${i===(s.raceweeks||8)-1?'Entlastung':i%4===3?'Erholungswoche':'überwiegend locker'}</article>`).join('')}</section>`}

function addFood(name,k,p,c,f){s.food.push({date:today(),name,k,p,c,f});save();render()}function remove(k,i){s[k].splice(i,1);save();render()}function render(){let a=calc(), foods=s.food.filter(x=>x.date===today()), sums=['k','p','c','f'].map(k=>foods.reduce((v,x)=>v+x[k],0));$('nav').innerHTML=['Übersicht','Ziele','Ernährung','Gewicht','Training','Rezepte','Wochenplan','Profil'].map(t=>`<button onclick="tab='${t}';render()">${t}</button>`).join('');let h='';if(tab==='Übersicht'){h=`<section><h2>Heute · ${today()}</h2><div class="big">${sums[0]} / ${a.kcal} kcal</div>${['Kalorien','Protein','Kohlenhydrate','Fett'].map((t,i)=>`<label>${t}: ${r(sums[i])} / ${[a.kcal,a.p,a.c,a.f][i]} ${i?'g':'kcal'}<progress max="${[a.kcal,a.p,a.c,a.f][i]}" value="${sums[i]}"></progress></label>`).join('')}<p>Gewicht: ${a.w} kg · Ziel: ${s.target} kg</p><p>Training: ${s.sport}, ${s.minutes} Min. locker, sofern erholt.</p><small>Geschätzter Bedarf inklusive protokollierter Aktivität: +${r(a.exercise)} kcal.</small></section>`}if(tab==='Profil'){h=`<section><h2>Profil</h2>${field('age','Alter',18,90)}${field('height','Größe cm',130,230)}${field('weight','Startgewicht kg',40,250,.1)}${sel('sex','Formelparameter',[[5,'männlich'],[-161,'weiblich']])}${sel('activity','Alltag ohne Sport',[[1.2,'Überwiegend sitzend'],[1.45,'Leicht aktiv'],[1.65,'Körperlich aktiv']])}<button onclick="update(['age','height','weight','sex','activity'])">Speichern</button><p>Grundumsatz: ${r(a.bmr)} kcal (Mifflin-St Jeor). Alltag: ${r(a.base)} kcal.</p><button onclick="exportData()">Datensicherung exportieren</button><label>Datensicherung importieren<input type="file" accept="application/json" onchange="importData(this)"></label></section>`}if(tab==='Ziele'){let weeks=a.delta===0?0:Math.abs(a.delta*7700/(a.adj||1)/7),low=a.w-Math.min(500,a.base*.2,Math.max(0,a.base-a.bmr))*a.days/7700,high=a.w+300*a.days/7700;h=`<section><h2>Zielrechner</h2>${sel('mode','Berechnung',[['both','Ziel + Zeitraum prüfen'],['goal','Ziel → Dauer'],['time','Zeitraum → Fortschritt']])}${field('target','Zielgewicht kg',40,250,.1)}${field('weeks','Zeitraum Wochen',1,104)}<button onclick="update(['mode','target','weeks'])">Berechnen</button><p>Kalorienanpassung: ${r(a.adj)} kcal/Tag</p><p>${s.mode==='time'?`Modellspanne nach ${s.weeks} Wochen: ${low.toFixed(1)}–${high.toFixed(1)} kg (Abnahme bis Zunahme); bei moderater Abnahme etwa ${(a.w+a.adj*a.days/7700).toFixed(1)} kg.`:`Geschätzte Dauer: ${a.adj===0&&a.delta!==0?'nicht berechenbar':weeks.toFixed(1)+' Wochen'}.`}</p>${s.mode==='both'&&weeks>s.weeks+.1?'<p>Das Ziel benötigt voraussichtlich mehr Zeit als angegeben.</p>':''}<small>Lineares Modell mit 7.700 kcal/kg, keine Garantie. Bei Ziel-BMI unter 18,5 keine Abnahmeplanung nutzen.</small></section>`}if(tab==='Gewicht'){let sorted=[...s.weights].sort((a,b)=>a.date.localeCompare(b.date)),recent=sorted.filter(x=>x.date>=new Date(Date.now()-6*86400000).toLocaleDateString('sv-SE')),avg=recent.length?recent.reduce((v,x)=>v+x.kg,0)/recent.length:a.w;let lo=Math.min(...sorted.map(x=>x.kg),a.w)-.5,hi=Math.max(...sorted.map(x=>x.kg),a.w)+.5;h=`<section><h2>Gewichtsanalyse</h2><div class="big">${a.w} kg</div><p>7-Tage-Mittel: ${avg.toFixed(2)} kg · BMI: ${(a.w/(s.height/100)**2).toFixed(1)}</p><svg viewBox="0 0 320 150"><polyline fill="none" stroke="#63e6be" stroke-width="3" points="${sorted.map((x,i)=>`${10+i*300/Math.max(1,sorted.length-1)},${140-(x.kg-lo)/(hi-lo)*130}`).join(' ')}"/></svg><label>Datum<input type="date" id="date" value="${today()}"></label><label>Gewicht kg<input type="number" id="kg" min="40" max="250" step=".1" value="${a.w}"></label><button onclick="if($('kg').checkValidity()&&$('kg').value&&$('date').value){s.weights=s.weights.filter(x=>x.date!==$('date').value);s.weights.push({date:$('date').value,kg:n($('kg').value)});save();render()}">Eintragen</button>${s.weights.map((x,i)=>`<article>${x.date}: ${x.kg} kg <button onclick="remove('weights',${i})">Löschen</button></article>`).join('')}</section>`}if(tab==='Ernährung'){h=`<section><h2>Lebensmittel erfassen</h2><label>Name<input id="name"></label>${['Kalorien','Protein g','Kohlenhydrate g','Fett g'].map((t,i)=>`<label>${t} pro Portion<input type="number" id="f${i}" min="0" value="0" step=".1"></label>`).join('')}<label>Portionen<input id="portion" type="number" min=".1" step=".1" value="1"></label><button onclick="if($('name').value&&['f0','f1','f2','f3','portion'].every(k=>$(k).checkValidity()&&$(k).value)){addFood($('name').value,...[0,1,2,3].map(i=>n($('f'+i).value)*n($('portion').value)))}">Hinzufügen</button>${s.food.map((x,i)=>`<article>${esc(x.name)} · ${x.date} · ${r(x.k)} kcal <button onclick="remove('food',${i})">Löschen</button></article>`).join('')}</section>`}if(tab==='Training'){h=`<section><h2>Trainingscoach</h2>${sel('sport','Sportart',['Laufen','Radfahren','Schwimmen','Krafttraining'].map(x=>[x,x]))}${field('minutes','Minuten pro Einheit',10,240)}${field('days','Einheiten pro Woche',1,7)}${field('km','Aktuelle Laufdistanz km',1,42.2,.1)}${field('current','Aktuelle Zeit Minuten',1,600,.1)}${field('race','Zieldistanz km',1,42.2,.1)}${field('goal','Zielzeit Minuten',1,600,.1)}<button onclick="update(['sport','minutes','days','km','current','race','goal'])">Plan berechnen</button><p>Aktuelle Pace: ${(s.current/s.km).toFixed(2)} min/km · Zielpace: ${(s.goal/s.race).toFixed(2)} min/km</p><p>Rechnerische Laufzeit über Zieldistanz (Riegel-Modell): ${(s.current*(s.race/s.km)**1.06).toFixed(1)} Min. Keine zeitgebundene Leistungsprognose.</p>${Array.from({length:s.days},(_,i)=>`<article>Einheit ${i+1}: ${s.sport} · ${s.minutes} Min. · ${i===1&&s.days>=3?'moderate Belastung, nur bei guter Erholung':'locker, Gesprächstempo'}</article>`).join('')}<button onclick="s.training.push({date:today(),sport:s.sport,minutes:s.minutes});save();render()">Einheit als absolviert speichern</button>${s.training.map((x,i)=>`<article>${x.date} · ${x.sport} · ${x.minutes} Min. <button onclick="remove('training',${i})">Löschen</button></article>`).join('')}</section>`}if(tab==='Rezepte'){let remaining=a.kcal-sums[0];h=`<section><h2>Thermomix-Rezepte</h2><p>Noch ${r(remaining)} kcal im Tagesbudget. Sortiert nach Passung zum Restbudget.</p><small>Eigene Rezeptideen, Nährwerte geschätzt, je 1 Portion. Geräteanleitung beachten.</small>${recipes.map((x,i)=>({...x,i})).sort((x,y)=>Math.abs(x.k-Math.min(remaining,650))-Math.abs(y.k-Math.min(remaining,650))).map(x=>`<article><h3>${x.name}</h3><p>${x.k} kcal · P ${x.p} / KH ${x.c} / F ${x.f} g</p><p>${x.items}</p><p>${x.steps}</p><button onclick="let x=recipes[${x.i}];addFood(x.name,x.k,x.p,x.c,x.f)">Als Mahlzeit eintragen</button></article>`).join('')}</section>`}if(tab==='Wochenplan')h=weekly(a);$('main').innerHTML=h;if(tab==='Ernährung')$('main').insertAdjacentHTML('afterbegin',foodSearch());if(tab==='Training')$('main').insertAdjacentHTML('beforeend',performance());}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='fitcoach-backup.json';a.click()}async function importData(e){try{let x=JSON.parse(await e.files[0].text());if(!['food','weights','training'].every(k=>Array.isArray(x[k])))throw Error();s={...defaults,...x};save();render()}catch{alert('Ungültige Sicherung')}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');</script></html>
