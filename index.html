const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('sv-SE'), defaults={age:40,height:175,weight:75,sex:5,activity:1.45,target:72,weeks:8,mode:'both',sport:'Laufen',minutes:45,days:3,km:10,current:59,race:10,goal:55,food:[],weights:[],training:[]};let s;try{s={...defaults,...JSON.parse(localStorage.fitcoach||'{}')}}catch{s={...defaults}};let tab='Home';const save=()=>localStorage.fitcoach=JSON.stringify(s), n=x=>Number(x), r=x=>Math.round(x), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), field=(k,l,min,max,step=1)=>`<label>${l}<input id="${k}" type="number" min="${min}" max="${max}" step="${step}" value="${s[k]}"></label>`, sel=(k,l,opts)=>`<label>${l}<select id="${k}">${opts.map(([v,t])=>`<option value="${v}" ${String(s[k])===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`;function update(keys){for(let k of keys){let e=$(k);if(!e.checkValidity()||e.value===''){alert('Bitte gültige Werte eingeben.');return} }for(let k of keys){let e=$(k);s[k]=e.type==='number'?n(e.value):e.value}save();render()}
function calc(){let w=s.weights.length?[...s.weights].sort((a,b)=>b.date.localeCompare(a.date))[0].kg:s.weight,bmr=10*w+6.25*s.height-5*s.age+n(s.sex),base=Math.max(bmr,bmr*n(s.activity)+adaptiveOffset()),delta=s.target-w,rate=delta<0?-.004*w:.002*w,days=s.weeks*7,desired=s.mode==='time'?rate* s.weeks:delta,raw=s.mode==='both'?desired*7700/days:rate*7700/7,adj=Math.max(-Math.min(500,base*.2,Math.max(0,base-bmr)),Math.min(300,raw));if(s.mode!=='time'&&Math.abs(delta)<.01)adj=0;if((w/(s.height/100)**2<=18.5||s.target/(s.height/100)**2<18.5)&&adj<0)adj=0;let exercise=s.training.filter(x=>x.date===today()).reduce((a,x)=>a+x.minutes*w*(x.sport==='Krafttraining'?3:5)/60,0), kcal=r(base+adj+exercise),p=r(w*1.6),f=r(w*.9),c=Math.max(0,r((kcal-p*4-f*9)/4));return {w,bmr,base,adj,kcal,p,f,c,delta,rate,days,exercise}}
const recipes=[{name:'Skyr-Hafer-Porridge',k:459,p:36,c:57,f:10,items:'60 g Haferflocken, 200 g Skyr, 100 g Beeren, 10 g Mandeln, 150 g Wasser',steps:'Haferflocken und Wasser 8 Min. / 90 °C / Linkslauf Stufe 1. Abkühlen lassen, Skyr unterrühren, Beeren und Mandeln daraufgeben.'},{name:'Lachs-Reis-Bowl',k:650,p:42,c:67,f:24,items:'150 g Lachs, 80 g Reis trocken, 150 g Karotten, 150 g Zucchini, 5 g Öl',steps:'Reis nach Packungsangabe im Garkorb mit ausreichend Wasser garen. Gemüse und Lachs im Varoma mit freien Dampfschlitzen etwa 20–25 Min. / Varoma / Stufe 1 garen. Garzustand prüfen; Fisch vollständig durchgaren.'},{name:'Hähnchen-Linsen-Curry',k:570,p:49,c:57,f:16,items:'150 g Hähnchenbrust, 70 g rote Linsen, 150 g Tomaten, 50 g Zwiebel, 50 g leichte Kokosmilch, 5 g Öl, 250 g Wasser',steps:'Zwiebel 5 Sek. / Stufe 5. Öl 3 Min. / 120 °C / Stufe 1. Rest zugeben, 25 Min. / 100 °C / Linkslauf Sanftrührstufe. Flüssigkeit und Garzustand prüfen; Hähnchen mindestens 70 °C für 2 Minuten im Kern.'},{name:'Quark-Bananen-Shake',k:330,p:33,c:43,f:3,items:'250 g Magerquark, 120 g Banane, 100 g Milch 1,5 %, Wasser nach Bedarf',steps:'Alles 30 Sek. / Stufe 7 mixen.'}];

{name:'Apfel-Zimt-Haferbrei',k:420,p:23,c:62,f:9,items:'60 g Haferflocken, 200 g Milch 1,5 %, 150 g Apfel, 100 g Skyr, Zimt',steps:'Apfel 4 Sek. / Stufe 5. Hafer und Milch 9 Min. / 90 °C / Linkslauf Stufe 1. Skyr nach Abkühlen unterheben.'},
{name:'Tomaten-Linsen-Suppe',k:490,p:25,c:68,f:12,items:'90 g rote Linsen, 250 g Tomaten, 50 g Zwiebel, 10 g Öl, 350 g Wasser',steps:'Zwiebel 5 Sek. / Stufe 5, Öl 3 Min. / 120 °C / Stufe 1. Rest 25 Min. / 100 °C / Stufe 1. Bei Bedarf länger garen.'},

{name:'Couscous-Kichererbsen-Bowl',k:610,p:23,c:92,f:17,items:'80 g Couscous, 120 g Kichererbsen gekocht, 150 g Paprika, 10 g Öl',steps:'Paprika 4 Sek. / Stufe 5. Couscous nach Packungsangabe mit heißem Wasser quellen lassen. Kichererbsen abspülen und alles mischen.'},

function foodSearch(){return `<section><h2>Lebensmittelsuche</h2><small>Open Food Facts: Internet erforderlich, Produktangaben können unvollständig sein.</small><input id="query" placeholder="Produktname oder Barcode"><button onclick="lookupFood()">Suchen</button><div id="results"></div></section>`}
let found=[];async function lookupFood(){let q=$('query').value.trim(),out=$('results');if(!q)return;out.textContent='Suche läuft …';try{let fields='product_name,nutriments,code',url=/^\d{8,14}$/.test(q)?`https://world.openfoodfacts.org/api/v2/product/${q}.json?fields=${fields}`:`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=${fields}`;let res=await fetch(url);if(!res.ok)throw Error();let data=await res.json();found=(data.products||[data.product]).filter(x=>x&&x.product_name&&['energy-kcal_100g','proteins_100g','carbohydrates_100g','fat_100g'].every(k=>Number.isFinite(x.nutriments?.[k])));out.innerHTML=found.length?found.map((x,i)=>`<article>${esc(x.product_name)} · ${x.nutriments['energy-kcal_100g']} kcal/100 g <button onclick="chooseFood(${i})">Übernehmen</button></article>`).join(''):'Keine vollständigen Treffer. Bitte manuell erfassen.'}catch{out.textContent='Suche nicht verfügbar. Bitte manuell erfassen.'}}

const half=(x,max=2)=>Math.max(.5,Math.min(max,Math.round(x*2)/2));
const fmt=x=>x.toLocaleString('de-DE',{maximumFractionDigits:1});

function oldMealPlan(a){return Array.from({length:7},(_,d)=>{let ids=[d%2?4:0,[1,2,5,7,8,2,1][d],[7,8,1,5,2,7,8][d],d%2?3:9],meals=ids.map(i=>recipes[i]),total=meals.reduce((v,x)=>v+x.k,0);return {meals,total,scale:half(a.kcal/total)}})}

function weekly(a){let plan=mealPlan(a);return `<section><h2>7-Tage-Ernährungsplan</h2><label>Supermarkt<select id="shop31" onchange="s.shop31=this.value;save();render()">${Object.keys(shops).map(k=>`<option ${k===(s.shop31||'Aldi Süd')?'selected':''}>${k}</option>`).join('')}</select></label><div id="cost31"></div><small>Portionen in halben Schritten; dadurch kann das Tagesziel abweichen. Garzeiten und Mixtopfgrenzen prüfen.</small>${plan.map((d,i)=>`<article><h3>${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][i]}</h3>${d.meals.map((x,j)=>`<p>${x.name} · ${fmt(d.scales[j])} Portionen</p>`).join('')}<small>${r(d.total)} kcal · ${['p','c','f'].map((k,j)=>['P','KH','F'][j]+' '+r(d.meals.reduce((v,x)=>v+x[k]*d.scales[d.meals.indexOf(x)],0))+' g').join(' · ')} · ${r(d.total-a.kcal)} kcal zum Ziel</small></article>`).join('')}<h3>Einkaufsliste</h3><div id="shopping"></div></section>`}

function addFood(name,k,p,c,f){s.food.push({date:today(),name,k,p,c,f});save();render()}function remove(k,i){s[k].splice(i,1);save();render()}function legacyRender(){let a=calc(), foods=s.food.filter(x=>x.date===today()), sums=['k','p','c','f'].map(k=>foods.reduce((v,x)=>v+x[k],0));$('nav').innerHTML=['Übersicht','Ziele','Ernährung','Gewicht','Training','Rezepte','Wochenplan','Profil'].map(t=>`<button aria-current="${tab===t?'page':'false'}" onclick="tab='${t}';render();window.scrollTo(0,0)"><span class="symbol" aria-hidden="true">${['◈','◎','🍴','⚖','⚡','♨','▦','⚙'][['Übersicht','Ziele','Ernährung','Gewicht','Training','Rezepte','Wochenplan','Profil'].indexOf(t)]}</span>${t}</button>`).join('');let h='';if(tab==='Übersicht'){h=`<section><h2>Heute · ${today()}</h2><div class="metrics"><div class="metric"><small>Verzehrt / Ziel</small><strong>${r(sums[0])} / ${a.kcal}</strong><small>kcal</small></div><div class="metric"><small>${a.kcal>=sums[0]?'Noch verfügbar':'Über Tagesziel'}</small><strong>${r(Math.abs(a.kcal-sums[0]))}</strong><small>kcal</small></div></div><div class="quick"><button onclick="tab='Ernährung';render()">+ Mahlzeit</button><button onclick="tab='Gewicht';render()">+ Gewicht</button></div>${['Kalorien','Protein','Kohlenhydrate','Fett'].map((t,i)=>`<label>${t}: ${r(sums[i])} / ${[a.kcal,a.p,a.c,a.f][i]} ${i?'g':'kcal'}<progress max="${[a.kcal,a.p,a.c,a.f][i]}" value="${sums[i]}"></progress></label>`).join('')}<p>Gewicht: ${a.w} kg · Ziel: ${s.target} kg</p><p>Training: ${s.sport}, ${s.minutes} Min. locker, sofern erholt.</p><small>Geschätzter Bedarf inklusive protokollierter Aktivität: +${r(a.exercise)} kcal.</small></section>`}if(tab==='Profil'){h=`<section><h2>Profil</h2>${field('age','Alter',18,90)}${field('height','Größe cm',130,230)}${field('weight','Startgewicht kg',40,250,.1)}${sel('sex','Formelparameter',[[5,'männlich'],[-161,'weiblich']])}${sel('activity','Alltag ohne Sport',[[1.2,'Überwiegend sitzend'],[1.45,'Leicht aktiv'],[1.65,'Körperlich aktiv']])}<button onclick="update(['age','height','weight','sex','activity'])">Speichern</button><p>Grundumsatz: ${r(a.bmr)} kcal (Mifflin-St Jeor). Alltag: ${r(a.base)} kcal.</p><button onclick="exportData()">Datensicherung exportieren</button><label>Datensicherung importieren<input type="file" accept="application/json" onchange="importData(this)"></label></section>`}if(tab==='Ziele'){let weeks=a.delta===0?0:Math.abs(a.delta*7700/(a.adj||1)/7),low=a.w-Math.min(500,a.base*.2,Math.max(0,a.base-a.bmr))*a.days/7700,high=a.w+300*a.days/7700;h=`<section><h2>Zielrechner</h2>${sel('mode','Berechnung',[['both','Ziel + Zeitraum prüfen'],['goal','Ziel → Dauer'],['time','Zeitraum → Fortschritt']])}${field('target','Zielgewicht kg',40,250,.1)}${field('weeks','Zeitraum Wochen',1,104)}<button onclick="update(['mode','target','weeks'])">Berechnen</button><p>Kalorienanpassung: ${r(a.adj)} kcal/Tag</p><p>${s.mode==='time'?`Modellspanne nach ${s.weeks} Wochen: ${low.toFixed(1)}–${high.toFixed(1)} kg (Abnahme bis Zunahme); bei moderater Abnahme etwa ${(a.w+a.adj*a.days/7700).toFixed(1)} kg.`:`Geschätzte Dauer: ${a.adj===0&&a.delta!==0?'nicht berechenbar':weeks.toFixed(1)+' Wochen'}.`}</p>${s.mode==='both'&&weeks>s.weeks+.1?'<p>Das Ziel benötigt voraussichtlich mehr Zeit als angegeben.</p>':''}<small>Lineares Modell mit 7.700 kcal/kg, keine Garantie. Bei Ziel-BMI unter 18,5 keine Abnahmeplanung nutzen.</small></section>`}if(tab==='Gewicht'){let sorted=[...s.weights].sort((a,b)=>a.date.localeCompare(b.date)),recent=sorted.filter(x=>x.date>=new Date(Date.now()-6*86400000).toLocaleDateString('sv-SE')),avg=recent.length?recent.reduce((v,x)=>v+x.kg,0)/recent.length:a.w;let lo=Math.min(...sorted.map(x=>x.kg),a.w)-.5,hi=Math.max(...sorted.map(x=>x.kg),a.w)+.5;h=`<section><h2>Gewichtsanalyse</h2><div class="big">${a.w} kg</div><p>7-Tage-Mittel: ${avg.toFixed(2)} kg · BMI: ${(a.w/(s.height/100)**2).toFixed(1)}</p><svg viewBox="0 0 320 150"><polyline fill="none" stroke="#63e6be" stroke-width="3" points="${sorted.map((x,i)=>`${10+i*300/Math.max(1,sorted.length-1)},${140-(x.kg-lo)/(hi-lo)*130}`).join(' ')}"/></svg><label>Datum<input type="date" id="date" value="${today()}"></label><label>Gewicht kg<input type="number" id="kg" min="40" max="250" step=".1" value="${a.w}"></label><button onclick="if($('kg').checkValidity()&&$('kg').value&&$('date').value){s.weights=s.weights.filter(x=>x.date!==$('date').value);s.weights.push({date:$('date').value,kg:n($('kg').value)});save();render()}">Eintragen</button>${s.weights.map((x,i)=>`<article>${x.date}: ${x.kg} kg <button onclick="remove('weights',${i})">Löschen</button></article>`).join('')}</section>`}if(tab==='Ernährung'){h=`<section><h2>Lebensmittel erfassen</h2><label>Name<input id="name"></label>${['Kalorien','Protein g','Kohlenhydrate g','Fett g'].map((t,i)=>`<label>${t} pro Portion<input type="number" id="f${i}" min="0" value="0" step=".1"></label>`).join('')}<label>Portionen<input id="portion" type="number" min=".5" step=".5" value="1"></label><button onclick="if($('name').value&&['f0','f1','f2','f3','portion'].every(k=>$(k).checkValidity()&&$(k).value)){addFood($('name').value,...[0,1,2,3].map(i=>n($('f'+i).value)*n($('portion').value)))}">Hinzufügen</button>${s.food.map((x,i)=>`<article>${esc(x.name)} · ${x.date} · ${r(x.k)} kcal <button onclick="remove('food',${i})">Löschen</button></article>`).join('')}</section>`}if(tab==='Training'){h=`<section><h2>Trainingscoach</h2>${sel('sport','Sportart',['Laufen','Radfahren','Schwimmen','Krafttraining','Triathlon'].map(x=>[x,x]))}${field('minutes','Minuten pro Einheit',10,240)}${field('days','Einheiten pro Woche',1,7)}${field('km','Aktuelle Laufdistanz km',1,42.2,.1)}${field('current','Aktuelle Zeit Minuten',1,600,.1)}${field('race','Zieldistanz km',1,42.2,.1)}${field('goal','Zielzeit Minuten',1,600,.1)}<button onclick="update(['sport','minutes','days','km','current','race','goal'])">Plan berechnen</button><p>Aktuelle Pace: ${(s.current/s.km).toFixed(2)} min/km · Zielpace: ${(s.goal/s.race).toFixed(2)} min/km</p><p>Rechnerische Laufzeit über Zieldistanz (Riegel-Modell): ${(s.current*(s.race/s.km)**1.06).toFixed(1)} Min. Keine zeitgebundene Leistungsprognose.</p>${Array.from({length:s.days},(_,i)=>`<article>Einheit ${i+1}: ${s.sport} · ${s.minutes} Min. · ${i===1&&s.days>=3?'moderate Belastung, nur bei guter Erholung':'locker, Gesprächstempo'}</article>`).join('')}<button onclick="s.training.push({date:today(),sport:s.sport,minutes:s.minutes});save();render()">Einheit als absolviert speichern</button>${s.training.map((x,i)=>`<article>${x.date} · ${x.sport} · ${x.minutes} Min. <button onclick="remove('training',${i})">Löschen</button></article>`).join('')}</section>`}if(tab==='Rezepte'){let remaining=a.kcal-sums[0];h=`<section><h2>Thermomix-Rezepte</h2><p>Noch ${r(remaining)} kcal im Tagesbudget. Sortiert nach Passung zum Restbudget.</p><small>Eigene Rezeptideen, Nährwerte geschätzt, je 1 Portion. Geräteanleitung beachten.</small>${recipes.map((x,i)=>({...x,i})).sort((x,y)=>Math.abs(x.k-Math.min(remaining,650))-Math.abs(y.k-Math.min(remaining,650))).map(x=>`<article><h3>${x.name}</h3><p>${x.k} kcal · P ${x.p} / KH ${x.c} / F ${x.f} g</p><p>${x.items}</p><p>${x.steps}</p><button onclick="let x=recipes[${x.i}];addFood(x.name,x.k,x.p,x.c,x.f)">Als Mahlzeit eintragen</button></article>`).join('')}</section>`}if(tab==='Wochenplan')h=weekly(a);$('main').innerHTML=h;if(tab==='Ernährung')$('main').insertAdjacentHTML('afterbegin',foodSearch());if(tab==='Training')$('main').insertAdjacentHTML('beforeend',performance());enhanceUI(a);adaptiveUI(a,sums);if(tab==='Wochenplan')copyShopping();smartUI(a);raceUI(a);bwUI();setupHelp();}
function enhanceUI(a){

'Heute':'Hier siehst du dein Tagesbudget und deine Makros. Über die Schnellaktionen erfasst du Mahlzeiten oder Gewicht.',

document.querySelectorAll('main section').forEach(sec=>{
let heading=sec.querySelector('h2');if(!heading)return;
let key=heading.textContent.split(' · ')[0],msg=help[key];
if(msg){let d=document.createElement('details');d.className='help';d.innerHTML='<summary>ⓘ Kurzhilfe</summary><p>'+msg+'</p>';heading.after(d);}
if(['Thermomix-Rezepte','7-Tage-Ernährungsplan','Leistungsziel und Zeitraum'].includes(key)){
let articles=[...sec.querySelectorAll('article')];
if(key==='Leistungsziel und Zeitraum'&&articles.length){let d=document.createElement('details');d.className='fold';d.innerHTML='<summary>Trainingswochen anzeigen ('+articles.length+')</summary>';articles[0].before(d);articles.forEach(x=>d.append(x));}
else articles.forEach(x=>{let h=x.querySelector('h3');if(!h)return;let d=document.createElement('details');d.className='fold';let summary=document.createElement('summary');summary.textContent=h.textContent;h.remove();let meta=key==='Thermomix-Rezepte'?x.querySelector('p'):x.querySelector('small');if(meta){let small=document.createElement('small');small.textContent=meta.textContent;summary.append(small);meta.remove();}d.append(summary);x.before(d);d.append(x);});

});
if(tab==='Gewicht'){let svg=document.querySelector('main svg');if(svg&&s.weights.length<2){let p=document.createElement('p');p.style.color='#a9b9c8';p.textContent='Ab zwei Gewichtseinträgen erscheint hier dein Verlauf.';svg.replaceWith(p);}}
}

function help3(msg){return `<details class="help"><summary>ⓘ Kurzhilfe</summary><p>${msg}</p></details>`}
function recentDate(d){let x=new Date();x.setDate(x.getDate()-d);return x.toLocaleDateString('sv-SE')}
function readiness(){let q=s.checkin;if(!q||q.date!==today())return null;return Math.max(0,Math.min(100,r(100-12*Math.max(0,8-q.sleep)-12*q.sore-10*q.stress-(q.pulse>0&&q.baseline>0?Math.max(0,q.pulse-q.baseline)*2:0))))}
function checkSave(){let ids=['sleep','sore','stress','pulse','baseline'];if(!ids.every(k=>$(k).checkValidity()&&$(k).value!==''))return;s.checkin={date:today(),...Object.fromEntries(ids.map(k=>[k,n($(k).value)]))};save();render()}
function checkPanel(){let q=s.checkin||{},score=readiness();return `<section class="hero"><h2>Dein Coach</h2>${help3('Der Check-in nutzt Schlaf, Muskelkater, Stress und optional Ruhepuls. Der Score ist eine eigene Orientierungshilfe, kein medizinisch validierter Messwert.')}<div class="big">${score===null?'Check-in offen':score+' / 100'}</div><p>${score===null?'Erfasse zuerst deine Erholung.':score<50?'Heute Erholung priorisieren.':score<75?'Heute nur locker trainieren.':'Lockeres Training möglich, sofern beschwerdefrei.'}</p><details class="fold"><summary>Tages-Check-in</summary>${[['sleep','Schlaf (Stunden)',0,24,.5,8],['sore','Muskelkater (0–4)',0,4,1,0],['stress','Stress (0–4)',0,4,1,0],['pulse','Ruhepuls (0 = unbekannt)',0,200,1,0],['baseline','Üblicher Ruhepuls (0 = unbekannt)',0,200,1,0]].map(([k,l,min,max,step,v])=>`<label>${l}<input type="number" id="${k}" min="${min}" max="${max}" step="${step}" value="${q[k]??v}"></label>`).join('')}<button onclick="checkSave()">Check-in speichern</button></details></section>`}
function trendReport(a){let w=s.weights.filter(x=>x.date>=recentDate(13)&&x.date<=today()),old=w.filter(x=>x.date<recentDate(6)),now=w.filter(x=>x.date>=recentDate(6)),avg=x=>x.reduce((v,y)=>v+y.kg,0)/x.length,delta=old.length>=3&&now.length>=3?avg(now)-avg(old):null,train=s.training.filter(x=>x.date>=recentDate(6)&&x.date<=today()),mins=train.reduce((v,x)=>v+x.minutes,0);return `<section><h2>Wochenreport</h2>${help3('Vergleicht die Mittelwerte zweier Sieben-Tage-Zeiträume und summiert absolvierte Einheiten. Mindestens drei Gewichtseinträge pro Woche sind erforderlich.')}<div class="metrics"><div class="metric"><small>Gewichtstrend</small><strong>${delta===null?'—':delta.toFixed(2)+' kg'}</strong></div><div class="metric"><small>Training / 7 Tage</small><strong>${mins} min</strong></div></div><p>${delta===null?'Noch zu wenige Gewichtsdaten für eine Trendempfehlung.':Math.abs(delta)>.01&&Math.sign(delta)!==Math.sign(a.adj)?'Trend und Zielrichtung weichen ab. Prüfe zunächst Vollständigkeit der Ernährungseinträge und beobachte eine weitere Woche.':'Gewichtstrend prüfen und bei Bedarf Ziel neu berechnen.'}</p><p>${train.length>=s.days?'Geplante Anzahl Einheiten erreicht. Erholung einplanen.':`${Math.max(0,s.days-train.length)} Einheiten bis zum Wochenziel; nicht auf Kosten der Erholung nachholen.`}</p></section>`}
function sim3(a){return `<section><h2>Zielsimulator</h2>${help3('Verändere das tägliche Defizit und den Zeitraum. Die lineare Modellrechnung berücksichtigt keine Stoffwechselanpassungen.')}<label>Defizit: <strong id="dv">300</strong> kcal/Tag<input id="def3" type="range" min="0" max="${Math.floor(Math.min(500,a.base*.2,Math.max(0,a.base-a.bmr)))}" value="300" oninput="simUpdate()"></label><label>Wochen: <strong id="wv">8</strong><input id="wk3" type="range" min="1" max="26" value="8" oninput="simUpdate()"></label><div id="simout"></div></section>`}
function simUpdate(){let d=n($('def3').value),w=n($('wk3').value),a=calc(),end=a.w-d*w*7/7700;$('dv').textContent=d;$('wv').textContent=w;$('simout').innerHTML=end/(s.height/100)**2<18.5?'Zielbereich nicht geeignet.':`<div class="big">${end.toFixed(1)} kg</div><p>Modelländerung: −${(a.w-end).toFixed(2)} kg · Alltag ohne Sport: ${r(a.base-d)} kcal/Tag</p>`}
function cook3(a,sums){let remain=Math.max(0,a.kcal-sums[0]),protein=Math.max(0,a.p-sums[1]),stock=(s.stock||'').toLowerCase().split(/[,;\n]/).map(x=>x.trim()).filter(Boolean),rank=recipes.map((x,i)=>{let scale=half(remain/x.k,1.5),matches=stock.filter(y=>x.items.toLowerCase().includes(y)).length;return {x,i,scale,score:Math.abs(x.k*scale-remain)/100+Math.abs(x.p*scale-protein)/10-matches*2}}).sort((x,y)=>x.score-y.score);return `<section><h2>Kochassistent</h2>${help3('Bewertet vorhandene Rezepte anhand deiner Vorräte und offenen Kalorien sowie Protein. Portionsfaktoren sind Vorschläge; Garzeiten und Mixtopfgrenzen separat beachten.')}<label>Vorräte (durch Komma getrennt)<input id="stock3" value="${esc(s.stock||'')}" placeholder="Reis, Lachs, Karotten"></label><button onclick="s.stock=$('stock3').value;save();render()">Vorschläge aktualisieren</button>${remain<=0?'<p>Tagesbudget erreicht; keine automatische Portionsvorgabe.</p>':rank.slice(0,3).map(({x,i,scale})=>`<details class="fold"><summary>${x.name} · ${r(x.k*scale)} kcal</summary><p>${fmt(scale)} Portionen · ${r(x.p*scale)} g Protein</p><p>${esc(scaledItems(x,scale))}</p><p>${esc(x.steps)}</p><button onclick="addFood(recipes[${i}].name,${x.k*scale},${x.p*scale},${x.c*scale},${x.f*scale})">Portion erfassen</button></details>`).join('')}</section>`}
function adaptiveUI(a,sums){document.body.classList.toggle('oled',s.theme==='oled');document.body.classList.toggle('light',s.theme==='light');if(tab==='Übersicht'){let rings=document.createElement('div');rings.className='rings';rings.innerHTML=['Energie','Protein','KH','Fett'].map((x,i)=>{let pct=Math.round(100*sums[i]/Math.max(1,[a.kcal,a.p,a.c,a.f][i]));return `<div><div class="ring" style="--fill:${Math.min(100,pct)}%"><span>${pct}%</span></div><small>${x}</small></div>`}).join('');$('main').querySelector('section h2').after(rings);$('main').insertAdjacentHTML('afterbegin',checkPanel());$('main').insertAdjacentHTML('beforeend',trendReport(a));}if(tab==='Ziele'){$('main').insertAdjacentHTML('beforeend',sim3(a));simUpdate()}if(tab==='Rezepte')$('main').insertAdjacentHTML('afterbegin',cook3(a,sums));if(tab==='Training'&&s.sport==='Triathlon')$('main').insertAdjacentHTML('afterbegin',`<section><h2>Triathlon-Woche</h2>${help3('Verteilt die geplanten Einheiten auf die drei Disziplinen. Koppeltraining nur bei ausreichender Erfahrung und Erholung.')} ${Array.from({length:s.days},(_,i)=>`<article>${['Schwimmen','Radfahren','Laufen','Schwimmen','Radfahren','Laufen','Rad + kurzer Koppellauf'][i]} · ${s.minutes} Min. gesamt · locker</article>`).join('')}</section>`);if(tab==='Profil')$('main').insertAdjacentHTML('beforeend',`<section><h2>Darstellung</h2>${sel('theme','Farbschema',[['dark','Dark'],['oled','OLED-Schwarz'],['light','Hell']])}<button onclick="update(['theme'])">Speichern</button></section>`);document.querySelector('.fab')?.remove();let b=document.createElement('button');b.className='fab';b.textContent='+';b.setAttribute('aria-label','Schnellerfassung');b.onclick=()=>{let d=document.createElement('dialog');d.style.cssText='background:#192630;color:white;border:1px solid #50616c;border-radius:20px;width:min(90%,400px)';d.innerHTML='<h2>Erfassen</h2>'+['Ernährung','Gewicht','Training'].map(t=>`<button onclick="this.closest(\'dialog\').close();tab=\'${t}\';render()">${t}</button>`).join('')+'<button onclick="this.closest(\'dialog\').close()">Schließen</button>';document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal()};document.body.append(b)}

function adaptiveOffset(){return s.adapt32?Math.max(-150,Math.min(150,Number(s.offset32)||0)):0}
function ingredients(x){return x.items.split(', ').map(t=>t.match(/^(\d+) g (.+)$/)).filter(m=>m&&m[2]!=='Wasser').map(m=>[m[2],+m[1]])}

function bwToggle(){if(!bw||bw.finished)return;bw.running=!bw.running;bw.last=Date.now();bwPaint();}
function bwTick(){if(!bw?.running)return;let now=Date.now(),dt=Math.min(bw.left,Math.max(0,(now-bw.last)/1000));bw.last=now;bw.left-=dt;if(bw.phase==='work'){let met=[3,4,5,6][bw.l];let k=met*3.5*bw.weight/200*dt/60;bw.kcal+=k;bw.exerciseKcal+=k;bw.seconds+=dt;}if(bw.left<=.01){bw.running=false;if(bw.phase==='work'){bw.phase='rest';bw.left=bw.rest;}else{bw.i++;bw.exerciseKcal=0;if(bw.i>=bw.ids.length){bw.finished=true;}else{bw.phase='work';bw.left=bw.work;}}}bwPaint();}
function bwPaint(){let el=$('bwLive');if(!el||!bw)return;let x=bwExercises[bw.ids[Math.min(bw.i,bw.ids.length-1)]];let markup=`<div class="metric"><small>${bw.finished?'Workout beendet':bw.phase==='rest'?'Pause':'Übung '+(bw.i+1)+' / '+bw.ids.length}</small><h3>${x[1][bw.l]}</h3><p>${x[2][bw.l]}</p><strong id="bwClock">${Math.ceil(bw.left)} s</strong><p>Übung: <span id="bwEk">${bw.exerciseKcal.toFixed(1)}</span> kcal · Gesamt: <span id="bwK">${bw.kcal.toFixed(1)}</span> kcal</p><small>Brutto-Schätzung nur während aktiver Übungen; Pausen nicht eingerechnet.</small>${bw.finished?'':`<button id="bwToggle" onclick="bwToggle()">${bw.running?'Pause':bw.phase==='rest'?'Pausentimer starten':'Übung starten / fortsetzen'}</button>`}<button onclick="bwFinish()">${bw.finished?'Workout speichern':'Workout beenden & speichern'}</button></div>`;let clock=$('bwClock');if(clock&&el.dataset.state===`${bw.i}-${bw.phase}-${bw.running}-${bw.finished}`){clock.textContent=Math.ceil(bw.left)+' s';$('bwEk').textContent=bw.exerciseKcal.toFixed(1);$('bwK').textContent=bw.kcal.toFixed(1);}else{el.innerHTML=markup;el.dataset.state=`${bw.i}-${bw.phase}-${bw.running}-${bw.finished}`;}}
function bwFinish(){if(!bw)return;if(bw.seconds>0){s.training.push({date:today(),sport:'Bodyweight · '+bw.program,minutes:Math.round(bw.seconds/60*10)/10,kcal:Math.round(bw.kcal)});save();}bw=null;render();}
setInterval(bwTick,200);


const hubs43={Workout:{icon:'⚡',title:'WORKOUT',sub:'Training · Bodyweight · Wettkampf',pages:['Bodyweight','Training','Wettkampf']},Nutrition:{icon:'◉',title:'ERNÄHRUNG',sub:'Makros · Rezepte · Einkauf',pages:['Ernährung','Rezepte','Wochenplan']},Body:{icon:'◎',title:'KÖRPER',sub:'Gewicht · Ziele · Regeneration',pages:['Gewicht','Ziele','Übersicht']}};
let editing43=false;
function order43(){let o=s.homeOrder43;return Array.isArray(o)&&o.length===3&&new Set(o).size===3&&o.every(k=>Object.hasOwn(hubs43,k))?o:['Workout','Nutrition','Body'];}
function move43(i,d){let o=[...order43()];if(i+d<0||i+d>=o.length)return;[o[i],o[i+d]]=[o[i+d],o[i]];s.homeOrder43=o;save();render();}
function go43(t){tab=t;editing43=false;render();window.scrollTo(0,0);}
function render(){let a=calc(),main=$('main'),hub=Object.keys(hubs43).find(k=>hubs43[k].pages.includes(tab));if(tab==='Home'||hubs43[tab]){document.body.classList.toggle('oled',s.theme==='oled');document.body.classList.toggle('light',s.theme==='light');document.querySelector('.fab')?.remove();if(tab==='Home'){main.innerHTML=`<div class="homehead43"><h2>Dein Dashboard</h2><button onclick="editing43=!editing43;render()">${editing43?'Fertig':'⇅ Anordnen'}</button></div>${order43().map((k,i)=>{let x=hubs43[k];return `<section class="tile43"><button class="tileopen43" onclick="go43('${k}')"><span class="tileicon43">${x.icon}</span><strong>${x.title}</strong><small>${x.sub}</small><span class="tilearrow43">›</span></button>${editing43?`<div class="reorder43"><button ${i===0?'disabled':''} onclick="move43(${i},-1)">↑ Nach oben</button><button ${i===2?'disabled':''} onclick="move43(${i},1)">↓ Nach unten</button></div>`:''}</section>`}).join('')}`;}else{let x=hubs43[tab];main.innerHTML=`<h2>${x.title}</h2>${x.pages.map(t=>`<section class="tile43"><button class="tileopen43" onclick="go43('${t}')"><strong>${({'Übersicht':'Tagesübersicht & Wochenreport','Training':'Ausdauer & Trainingscoach','Wettkampf':'Wettkampfvorbereitung','Bodyweight':'Bodyweight Workout','Gewicht':'Gewicht & Verlauf','Ziele':'Zielrechner','Ernährung':'Lebensmittel & Makros','Rezepte':'Rezepte & Kochmodus','Wochenplan':'Wochenplan & Einkauf'})[t]}</strong><span class="tilearrow43">›</span></button></section>`).join('')}`;}}else{legacyRender();if(hub){main.insertAdjacentHTML('afterbegin',`<button class="back43" onclick="go43('${hub}')">‹ ${hubs43[hub].title}</button>`);}document.querySelector('.fab')?.remove();}if(tab!=='Home'&&hubs43[tab])main.insertAdjacentHTML('afterbegin','<button class="back43" onclick="go43(&quot;Home&quot;)">‹ Dashboard</button>');$('nav').innerHTML=[['Home','⌂','Home'],['Übersicht','▦','Report'],['Profil','⚙','Profil']].map(([t,i,l])=>`<button aria-current="${tab===t?'page':'false'}" onclick="go43('${t}')"><span class="symbol">${i}</span>${l}</button>`).join('');}

function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='fitcoach-backup.json';a.click()}async function importData(e){try{let x=JSON.parse(await e.files[0].text());if(!['food','weights','training'].every(k=>Array.isArray(x[k])))throw Error();s={...defaults,...x};save();render()}catch{alert('Ungültige Sicherung')}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');</script></html>
